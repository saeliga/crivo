<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRIVO-PE Pré-teste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Baixa a biblioteca do Firebase em paralelo com a página (usada só no GitHub Pages). -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: faixa institucional no topo; na avaliação, caso à esquerda (fixo ao rolar) e instrumento à direita, empilhados no celular. */
:root {
  --bg: #f4f6f2;
  --surface: #ffffff;
  --surface-2: #eaf0e8;
  --fg: #17241c;
  --muted: #56645b;
  --line: #d3ddd2;
  --accent: #0d6b3f;
  --accent-fg: #ffffff;
  --accent-soft: #dcefe2;
  --gold: #e4b400;
  --gold-soft: #fff4cc;
  --warn: #9a4b00;
  --warn-soft: #fdebd8;
  --danger: #a3262a;
  --plate: #ffffff;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", "Segoe UI", Arial, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #18221c; --surface-2: #1f2c24; --fg: #e5ede7; --muted: #a2b2a8; --line: #2e3d34;
    --accent: #4fbf86; --accent-fg: #0b1a12; --accent-soft: #1d3a2a; --gold: #f2c94c; --gold-soft: #3a3115;
    --warn: #f0a560; --warn-soft: #3b2814; --danger: #f08a8d; --plate: #f4f6f2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #18221c; --surface-2: #1f2c24; --fg: #e5ede7; --muted: #a2b2a8; --line: #2e3d34;
  --accent: #4fbf86; --accent-fg: #0b1a12; --accent-soft: #1d3a2a; --gold: #f2c94c; --gold-soft: #3a3115;
  --warn: #f0a560; --warn-soft: #3b2814; --danger: #f08a8d; --plate: #f4f6f2; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.75rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; font-family: var(--font-body); font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabeçalho */
.topo { background: var(--surface); border-bottom: 3px solid var(--accent); }
.topo .wrap { display: flex; align-items: center; gap: 20px; padding-block: 12px; flex-wrap: wrap; }
.logos { display: flex; align-items: center; gap: 14px; background: var(--plate); border-radius: 8px; padding: 6px 12px; }
.logos img { display: block; height: 52px; width: auto; }
.logos .sep { width: 1px; height: 40px; background: #d3ddd2; }
.marca { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.marca strong { font-family: var(--font-display); font-size: 1.35rem; letter-spacing: .02em; }
.marca span { color: var(--muted); font-size: .85rem; }
.topo .acoes { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.selo-mock { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; background: var(--gold-soft); color: var(--fg); border: 1px solid var(--gold); padding: 3px 8px; border-radius: 999px; }

main { padding-block: 24px 48px; }
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.pilha { display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--muted); }
.peq { font-size: .85rem; }
.rotulo { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* Botões */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn-pri { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn-pri:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-link { border: 0; background: none; padding: 4px 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-weight: 600; }
.linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Formulários */
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label, .campo .leg { font-weight: 600; }
.campo input[type=text], .campo input[type=email], .campo select, .campo textarea, textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
.grade2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 720px) { .grade2 { grid-template-columns: 1fr; } }
.tcle { background: var(--surface-2); border-radius: 8px; padding: 14px 16px; max-height: 220px; overflow: auto; font-size: .9rem; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); }

/* Lista de casos */
.casos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.caso-card { display: flex; flex-direction: column; gap: 10px; }
.caso-card .status { align-self: flex-start; }
.pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.and { background: var(--gold-soft); color: var(--fg); }
.tempo { font-variant-numeric: tabular-nums; }

/* Tela do caso */
.caso-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .caso-layout { grid-template-columns: 1fr; } }
.caso-fixo { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; }
@media (max-width: 900px) { .caso-fixo { position: static; max-height: none; } }
.resumo { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: .92rem; }
.dx { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.dx:first-of-type { border-top: 0; padding-top: 0; }
.dx-topo { display: flex; gap: 10px; align-items: baseline; }
.prio { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: .85rem; }
.prio.fora { background: var(--surface-2); color: var(--muted); }
.dx-tit { font-weight: 700; }
.dx small { color: var(--muted); }
.just { font-style: italic; font-size: .9rem; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .78rem; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--surface); }
.lig { font-size: .85rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; }
.lig b { color: var(--muted); font-weight: 600; }

.relogio { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 14px; }
.relogio .tempo { font-weight: 700; }
.ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.ponto.pausa { background: var(--warn); }
@media (prefers-reduced-motion: no-preference) { .ponto:not(.pausa) { animation: pulsa 1.6s ease-in-out infinite; } }
@keyframes pulsa { 50% { opacity: .35; } }

.passos { display: flex; gap: 6px; flex-wrap: wrap; }
.passo { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: .9rem; }
.passo[aria-current="step"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.passo .n { font-variant-numeric: tabular-nums; font-size: .78rem; color: var(--muted); font-weight: 500; }
.passo.ok .n { color: var(--accent); }

.instrucao { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 8px; padding: 12px 14px; font-size: .9rem; }
.bloco { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.bloco > h3 { display: flex; gap: 8px; align-items: baseline; }
.item { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
.item:first-of-type { border-top: 0; padding-top: 0; }
.item .perg { font-weight: 600; }
.item.pend .perg::after { content: " · pendente"; color: var(--warn); font-weight: 500; font-size: .85rem; }
.opcoes { display: flex; flex-wrap: wrap; gap: 6px; }
.op { position: relative; }
.op input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.op span { display: inline-flex; flex-direction: column; align-items: center; min-width: 54px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .85rem; line-height: 1.2; text-align: center; }
.op span b { font-size: 1rem; }
.op input:checked + span { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.op input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.subitem { display: flex; flex-direction: column; gap: 8px; padding-block: 4px; }
.subitem > .peq { font-size: .92rem; }
.subitem.ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding-block: 2px; }
@media (max-width: 560px) { .subitem.ev { grid-template-columns: 1fr; } }
.cod { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; font-weight: 500; }
.rodape-parte { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.aviso { color: var(--warn); font-weight: 600; font-size: .9rem; }

table.resumo-t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.resumo-t th, .resumo-t td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.resumo-t th { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tabela-rolagem { overflow-x: auto; }
.rodape { color: var(--muted); font-size: .8rem; padding-block: 0 32px; }

/* Treinamento */
.modulos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.modulos li { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); }
.modulos .nm { display: flex; gap: 10px; align-items: baseline; }
.leitura { display: flex; flex-direction: column; gap: 12px; }
.leitura ol, .leitura ul { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.leitura h3 { margin-top: 6px; }
.quiz-item { display: flex; flex-direction: column; gap: 2px; font-size: .9rem; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; }
.quiz { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.op input:disabled { cursor: default; }
.retorno { border-left: 4px solid var(--line); padding: 8px 12px; font-size: .9rem; background: var(--surface); border-radius: 0 8px 8px 0; grid-column: 1 / -1; }
.retorno.certo { border-left-color: var(--accent); }
.retorno.errado { border-left-color: var(--warn); }
.retorno strong { display: block; }
.revisao { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; font-size: .9rem; }
.faixa-treino { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
</style>
</head>
<body>
<header class="topo">
  <div class="wrap">
    <div class="logos" aria-label="Universidade Federal do Rio Grande do Norte e Programa de Pós-Graduação em Enfermagem">
      <img src="assets/ufrn.png" alt="Brasão da UFRN" width="45" height="52">
      <span class="sep" aria-hidden="true"></span>
      <img src="assets/pgenf.jpg" alt="Logo do PGENF" width="113" height="52">
    </div>
    <div class="marca">
      <strong>CRIVO-PE</strong>
      <span>Avaliação crítica de planos de enfermagem sugeridos por inteligência artificial</span>
    </div>
    <div class="acoes"><span class="muted peq" id="status-nuvem" role="status"></span><span class="selo-mock">Pré-teste</span></div>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer class="wrap rodape" id="rodape">Pesquisa de mestrado do PGENF/UFRN. Casos clínicos fictícios.</footer>

<script src="js/nuvem.js"></script>
<script src="js/treino.js"></script>
<script>
window.iniciarCrivo = function (inicial) {
  'use strict';
  const CASOS = window.CRIVO_CASOS || [];
  const CHAVE = 'crivo-pre-teste-v1';
  const PARTES = [
    { n: 1, nome: 'Diagnósticos' },
    { n: 2, nome: 'Resultados (NOC)' },
    { n: 3, nome: 'Intervenções (NIC)' },
    { n: 4, nome: 'Justificativa' },
    { n: 5, nome: 'Plano como um todo' },
  ];
  const ESC_PERT = ['Não pertinente', 'Pouco pertinente', 'Pertinente', 'Totalmente pertinente'];
  const ESC_GRAU = ['Não', 'Pouco', 'Em grande parte', 'Totalmente'];
  const ESC_CLARO = ['Nada claro', 'Pouco claro', 'Claro', 'Muito claro'];
  const MODULOS = window.CRIVO_MODULOS || [];
  const CASOS_AV = CASOS.filter((c) => !c.treino);
  const CASO_TREINO = CASOS.find((c) => c.treino) || null;

  // ---------------------------------------------------------------- estado
  function novoEstado() {
    return { etapa: 'inicio', avaliador: {}, casoAtual: null, parteAtual: 1, respostas: {}, questionario: {}, treino: novoTreino() };
  }
  // Treinamento: situacao novo | andamento | pulado | concluido; pulou fica registrado mesmo se voltar depois.
  function novoTreino() { return { situacao: 'novo', pulou: false, mod: 0, vistos: {}, tempos: {}, quiz: {}, inicio: null, fim: null }; }
  const NUVEM = !!(inicial && window.crivoNuvem && window.crivoNuvem.ativo);
  let E = NUVEM ? Object.assign(novoEstado(), inicial.estado || {}) : carregar();
  if (NUVEM && inicial.convite && !E.avaliador.nome) { E.avaliador.nome = inicial.convite.nome || ''; E.avaliador.email = inicial.convite.email || ''; }
  if (!E.treino) E.treino = novoTreino();
  document.getElementById('rodape').textContent = NUVEM
    ? 'Pesquisa de mestrado do PGENF/UFRN. Casos clínicos fictícios. Suas respostas são salvas automaticamente; você pode fechar e voltar pelo mesmo link.'
    : 'Modo local: as respostas ficam apenas neste navegador. Pesquisa de mestrado do PGENF/UFRN; casos clínicos fictícios.';
  function carregar() {
    try { const t = localStorage.getItem(CHAVE); if (t) return Object.assign(novoEstado(), JSON.parse(t)); } catch (e) { /* sem armazenamento */ }
    return novoEstado();
  }
  function salvar(imediato) {
    if (NUVEM) { window.crivoNuvem.salvar(E, imediato === true); return; }
    try { localStorage.setItem(CHAVE, JSON.stringify(E)); } catch (e) { /* sem armazenamento */ }
  }
  function rc(id) {
    if (!E.respostas[id]) E.respostas[id] = { r: {}, tempos: { total: 0, partes: {} }, inicio: null, fim: null, concluido: false };
    return E.respostas[id];
  }

  // ---------------------------------------------------------------- utilidades
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mmss = (ms) => { const s = Math.floor((ms || 0) / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const app = document.getElementById('app');
  const caso = (id) => CASOS.find((c) => c.id === id);
  const top3 = (c) => c.diagnosticos.filter((d) => d.prioridade <= 3);

  // ---------------------------------------------------------------- itens por parte
  function itensDaParte(c, n) {
    const L = [];
    if (n === 1) c.diagnosticos.forEach((d) => {
      L.push({ k: `p1.${d.id}.eade`, req: true });
      d.evidencias.forEach((_, i) => L.push({ k: `p1.${d.id}.ev${i}`, req: true }));
    });
    if (n === 2) top3(c).forEach((d) => (d.noc || []).forEach((_, i) => { L.push({ k: `p2.${d.id}.${i}.21`, req: true }); L.push({ k: `p2.${d.id}.${i}.22`, req: true }); }));
    if (n === 3) top3(c).forEach((d) => { (d.nic || []).forEach((_, i) => { L.push({ k: `p3.${d.id}.${i}.31`, req: true }); L.push({ k: `p3.${d.id}.${i}.32`, req: true }); }); L.push({ k: `p3.${d.id}.33`, req: true }); });
    if (n === 4) c.diagnosticos.forEach((d) => { L.push({ k: `p4.${d.id}.41`, req: true }); L.push({ k: `p4.${d.id}.42`, req: true }); });
    if (n === 5) {
      const r = rc(c.id).r;
      ['p5.51', 'p5.52', 'p5.53', 'p5.54', 'p5.57'].forEach((k) => L.push({ k, req: true }));
      if (r['p5.54'] === 'sim') { L.push({ k: 'p5.55', req: true }); L.push({ k: 'p5.56', req: true }); }
    }
    return L;
  }
  function pendentes(c, n) { const r = rc(c.id).r; return itensDaParte(c, n).filter((i) => i.req && !r[i.k]).length; }
  function totalPendentes(c) { return PARTES.reduce((s, p) => s + pendentes(c, p.n), 0); }

  // ---------------------------------------------------------------- relógio (tempo ativo)
  let ultimo = null, pausado = false, timer = null;
  function emRevisao() { const c = E.etapa === 'caso' && caso(E.casoAtual); return !!(c && c.treino && rc(c.id).concluido); }
  function contando() { return ((E.etapa === 'caso' && !emRevisao()) || E.etapa === 'modulo') && !pausado && document.visibilityState === 'visible'; }
  const tempoModulos = () => Object.values(E.treino.tempos).reduce((s, v) => s + v, 0);
  function tick() {
    const agora = Date.now();
    if (contando() && ultimo) {
      const dt = Math.min(agora - ultimo, 5000);
      if (E.etapa === 'modulo') E.treino.tempos[E.treino.mod] = (E.treino.tempos[E.treino.mod] || 0) + dt;
      else { const t = rc(E.casoAtual).tempos; t.total += dt; t.partes[E.parteAtual] = (t.partes[E.parteAtual] || 0) + dt; }
    }
    ultimo = agora;
    const el = document.getElementById('relogio-tempo');
    if (el) el.textContent = mmss(E.etapa === 'modulo' ? tempoModulos() : rc(E.casoAtual).tempos.total);
    const pt = document.getElementById('relogio-ponto');
    if (pt) pt.classList.toggle('pausa', !contando());
  }
  function iniciarRelogio() { ultimo = Date.now(); clearInterval(timer); timer = setInterval(() => { tick(); }, 1000); }
  // Na nuvem, o relógio é gravado a cada minuto (as respostas, logo após cada mudança).
  setInterval(salvar, NUVEM ? 60000 : 5000);
  document.addEventListener('visibilitychange', () => { tick(); salvar(document.visibilityState === 'hidden'); });

  // ---------------------------------------------------------------- componentes
  function escala(k, rot, nums) {
    const r = rc(E.casoAtual).r;
    return `<div class="opcoes" role="radiogroup">${rot.map((t, i) => {
      const v = nums ? String(i + 1) : t.toLowerCase();
      return `<label class="op"><input type="radio" name="${k}" value="${esc(v)}" data-k="${k}" ${r[k] === v ? 'checked' : ''}><span>${nums ? `<b>${i + 1}</b>` : ''}${esc(t)}</span></label>`;
    }).join('')}</div>${retorno(k, rot, nums)}`;
  }
  // No caso guiado já concluído, mostra o gabarito comentado abaixo de cada resposta.
  function retorno(k, rot, nums) {
    if (!emRevisao()) return '';
    const g = (caso(E.casoAtual).gabarito || {})[k]; if (!g) return '';
    const v = rc(E.casoAtual).r[k];
    const rotulo = (x) => (nums ? `${x} (${rot[+x - 1]})` : (rot.find((t) => t.toLowerCase() === x) || x));
    const certo = g.ok.includes(v);

            ${CASO_TREINO ? `<li><span class="nm"><span class="cod">${MODULOS.length + 1}</span><span>Caso guiado <span class="muted peq">· cerca de 15 min</span></span></span>
              <span class="linha"><span class="pill ${g.concluido ? 'ok' : g.inicio ? 'and' : ''}">${g.concluido ? 'Concluído' : g.inicio ? 'Em andamento' : 'Não iniciado'}</span><button class="btn" data-abrir="${CASO_TREINO.id}">${g.concluido ? 'Ver gabarito' : g.inicio ? 'Continuar' : 'Abrir'}</button></span></li>` : ''}

      </div>`;
  }
  function proximoModulo() { const i = MODULOS.findIndex((_, j) => !T().vistos[j]); return i < 0 ? 0 : i; }

  function telaModulo() {
    const t = T(); const i = t.mod; const m = MODULOS[i];

    app.innerHTML = `
      <div class="pilha">

            </div>`; }).join('')}

        <div class="linha" style="justify-content:space-between">
          ${i > 0 ? '<button class="btn" id="btn-mod-ant">Módulo anterior</button>' : '<span></span>'}
          ${ultimo ? (CASO_TREINO ? `<button class="btn btn-pri" data-abrir="${CASO_TREINO.id}">Ir para o caso guiado</button>` : '<button class="btn btn-pri" id="btn-treino-fim">Concluir o treinamento</button>')

  function corpoParte(c, n) {
    if (n === 1) return `
      <div class="instrucao"><strong>Parte 1.</strong> Para cada diagnóstico, classifique a acurácia pela EADE-2, considerando presença, relevância, especificidade e coerência das pistas do caso, e diga se cada evidência marcada pela IA está sustentada pelos dados.</div>
      ${c.diagnosticos.map((d) => `<div class="bloco"><h3><span class="prio ${d.prioridade > 3 ? 'fora' : ''}">${d.prioridade}</span>${esc(d.titulo)}</h3>
        ${item(`p1.${d.id}.eade`, '1.1', 'Acurácia do diagnóstico (EADE-2)', escala(`p1.${d.id}.eade`, ['Alta', 'Moderada', 'Baixa', 'Nula'], false))}
        ${item(d.evidencias.map((_, i) => `p1.${d.id}.ev${i}`), '1.2', 'Cada evidência indicada pela IA está sustentada pelos dados do caso?',
          d.evidencias.map((e, i) => `<div class="subitem ev"><span>${esc(e)}</span>${simNao(`p1.${d.id}.ev${i}`)}</div>`).join(''))}
      </div>`).join('')}`;
    if (n === 2) return `
      <div class="instrucao"><strong>Parte 2.</strong> Apenas para os três diagnósticos prioritários. Julgue cada resultado (NOC) de 1 a 4.</div>

          <div class="subitem"><span class="peq"><span class="cod">2.1</span>Pertinente ao diagnóstico e permite acompanhar a evolução?</span>${escala(`p2.${d.id}.${i}.21`, ESC_PERT, true)}</div>
          <div class="subitem"><span class="peq"><span class="cod">2.2</span>Pertinente ao caso (condição clínica e objetivo de cuidado)?</span>${escala(`p2.${d.id}.${i}.22`, ESC_PERT, true)}</div></div>`).join('')}
      </div>`).join('')}`;
    if (n === 3) return `
      <div class="instrucao"><strong>Parte 3.</strong> Apenas para os três diagnósticos prioritários. Julgue cada intervenção (NIC) e, ao final, o conjunto.</div>
      ${top3(c).map((d) => `<div class="bloco"><h3><span class="prio">${d.prioridade}</span>${esc(d.titulo)}</h3>
        ${(d.nic || []).map((x, i) => `<div class="item"><p class="perg">${esc(x)}</p>
          <div class="subitem"><span class="peq"><span class="cod">3.1</span>Pertinente ao diagnóstico?</span>${escala(`p3.${d.id}.${i}.31`, ESC_PERT, true)}</div>
          <div class="subitem"><span class="peq"><span class="cod">3.2</span>Aplicável ao caso na UTI e compatível com as boas práticas e protocolos vigentes?</span>${escala(`p3.${d.id}.${i}.32`, ESC_PERT, true)}</div></div>`).join('')}
        ${item(`p3.${d.id}.33`, '3.3', 'O conjunto de intervenções é suficiente para alcançar os resultados deste diagnóstico?', escala(`p3.${d.id}.33`, ESC_GRAU, true))}
      </div>`).join('')}`;
    if (n === 4) return `
      <div class="instrucao"><strong>Parte 4.</strong> Avalie a justificativa escrita pela IA para cada diagnóstico.</div>
      ${c.diagnosticos.map((d) => `<div class="bloco"><h3><span class="prio ${d.prioridade > 3 ? 'fora' : ''}">${d.prioridade}</span>${esc(d.titulo)}</h3>
        <p class="just">“${esc(d.justificativa)}”</p>
        ${item(`p4.${d.id}.41`, '4.1', 'A justificativa é coerente com os dados do caso?', escala(`p4.${d.id}.41`, ESC_GRAU, true))}
        ${item(`p4.${d.id}.42`, '4.2', 'A justificativa menciona algum dado que não está no caso?', simNao(`p4.${d.id}.42`),
          rc(c.id).r[`p4.${d.id}.42`] === 'sim' ? texto(`p4.${d.id}.42t`, 'Qual dado?') : '')}
      </div>`).join('')}`;
    const r = rc(c.id).r;

      <div class="instrucao"><strong>Parte 5.</strong> Avalie o plano como um todo, uma vez por caso.</div>
      <div class="bloco">
        ${item('p5.51', '5.1', 'O plano contempla as necessidades humanas básicas afetadas que os dados do caso evidenciam?', escala('p5.51', ESC_GRAU, true))}

        ${item('p5.54', '5.4', 'Alguma sugestão do plano poderia causar dano ao paciente se aceita sem revisão?', simNao('p5.54'), r['p5.54'] === 'sim' ? texto('p5.54t', 'Descreva a sugestão e o dano possível.') : '')}
        ${r['p5.54'] === 'sim' ? item('p5.55', '5.5', 'Gravidade do dano potencial', escala('p5.55', ['Leve', 'Moderado', 'Grave'], false)) : ''}

              <div class="rodape-parte">
                <span class="${pend ? 'aviso' : 'muted peq'}">${pend ? `${pend} resposta(s) pendente(s) nesta parte` : 'Parte completa'} · tempo nesta parte: <span class="tempo">${mmss(x.tempos.partes[n])}</span></span>
                <div class="linha">
                  ${n > 1 ? '<button class="btn" id="btn-ant">Parte anterior</button>' : ''}
                  ${n < 5 ? '<button class="btn btn-pri" id="btn-prox">Próxima parte</button>' : rev ? `<button class="btn btn-pri" id="btn-treino-fim">${T().situacao === 'concluido' ? 'Ir para os casos' : 'Concluir o treinamento e ir para os casos'}</button>` : `<button class="btn btn-pri" id="btn-concluir">${c.treino ? 'Concluir e ver o gabarito' : 'Concluir caso'}</button>`}
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>`;
    iniciarRelogio();
  }

  function telaQuestionario() {
    const q = E.questionario;
    const linha = (k, rot) => `<div class="opcoes">${rot.map((t, i) => `<label class="op"><input type="radio" name="q-${k}" data-q="${k}" value="${i + 1}" ${q[k] === String(i + 1) ? 'checked' : ''}><span><b>${i + 1}</b>${t}</span></label>`).join('')}</div>`;
    app.innerHTML = `
      <div class="pilha" style="max-width:960px">
        <div class="pilha" style="gap:6px"><p class="rotulo">Questionário do pré-teste</p><h1>Como foi aplicar o instrumento?</h1>
          <p class="muted">Suas respostas orientam os ajustes de redação antes das rodadas com os juízes.</p></div>
        ${PARTES.map((p) => `<section class="painel pilha"><h2>Parte ${p.n}: ${p.nome}</h2>
          <div class="campo"><span class="leg">As instruções e os itens desta parte ficaram claros?</span>${linha('claro' + p.n, ESC_CLARO)}</div>
          <div class="campo"><label for="q-duv${p.n}">Itens com dúvida e sugestões de redação</label><textarea id="q-duv${p.n}" data-q="duv${p.n}">${esc(q['duv' + p.n] || '')}</textarea></div>
        </section>`).join('')}
        ${MODULOS.length ? `<section class="painel pilha"><h2>Treinamento</h2>
          ${T().situacao === 'concluido' || T().situacao === 'andamento' ? `
          <div class="campo"><span class="leg">O treinamento preparou você para aplicar o instrumento?</span>${linha('tr_prep', ESC_GRAU)}</div>
          <div class="campo"><span class="leg">Os módulos foram claros?</span>${linha('tr_claro', ESC_CLARO)}</div>
          ${CASO_TREINO ? `<div class="campo"><span class="leg">O caso guiado com gabarito ajudou?</span>${linha('tr_guiado', ESC_GRAU)}</div>` : ''}
          <div class="campo"><label for="q-tr_sug">O que faltou ou sobrou no treinamento?</label><textarea id="q-tr_sug" data-q="tr_sug">${esc(q.tr_sug || '')}</textarea></div>`
          : `<div class="campo"><label for="q-tr_motivo">Você pulou o treinamento. Por quê? (opcional)</label><textarea id="q-tr_motivo" data-q="tr_motivo">${esc(q.tr_motivo || '')}</textarea></div>`}
        </section>` : ''}
        <section class="painel pilha"><h2>Visão geral</h2>
          <div class="campo"><span class="leg">O tempo de aplicação por caso foi adequado?</span>${linha('tempo', ['Muito longo', 'Longo', 'Adequado', 'Curto'])}</div>
          <div class="campo"><label for="q-geral">Comentários gerais</label><textarea id="q-geral" data-q="geral">${esc(q.geral || '')}</textarea></div>
        </section>
        <div class="linha"><button class="btn" id="btn-voltar">← Casos</button><button class="btn btn-pri" id="btn-finalizar">Finalizar pré-teste</button></div>
      </div>`;
  }

  function telaFim() {
    const dados = { instrumento: 'CRIVO-PE', versao: 'pré-teste 0.2', avaliador: E.avaliador, treino: E.treino, respostas: E.respostas, questionario: E.questionario, exportadoEm: new Date().toISOString() };
    const g = CASO_TREINO ? rc(CASO_TREINO.id).tempos.total : 0;
    app.innerHTML = `
      <div class="pilha" style="max-width:900px">
        <div class="pilha" style="gap:6px"><p class="rotulo">Pré-teste concluído</p><h1>Obrigado pela participação</h1>
          <p class="muted">Tempos ativos registrados, por caso e por parte (minutos:segundos).</p></div>
        <div class="painel tabela-rolagem"><table class="resumo-t"><thead><tr><th>Caso</th>${PARTES.map((p) => `<th>Parte ${p.n}</th>`).join('')}<th>Total</th></tr></thead><tbody>
          ${CASOS_AV.map((c) => { const t = rc(c.id).tempos; return `<tr><td>${esc(c.titulo)}</td>${PARTES.map((p) => `<td>${mmss(t.partes[p.n])}</td>`).join('')}<td><strong>${mmss(t.total)}</strong></td></tr>`; }).join('')}
        </tbody></table></div>
        ${MODULOS.length ? `<p class="muted peq">Treinamento: ${T().pulou && !tempoModulos() && !g ? 'pulado' : `módulos <span class="tempo">${mmss(tempoModulos())}</span>${CASO_TREINO ? ` · caso guiado <span class="tempo">${mmss(g)}</span>` : ''}`}.</p>` : ''}
        ${NUVEM ? '<section class="painel"><p>Suas respostas e os tempos já foram enviados ao pesquisador. Você pode fechar esta página.</p></section>' : `<section class="painel pilha"><h2>Dados do modo local</h2>
          <p class="muted peq">Na versão final, as respostas vão direto para a base da pesquisa. Neste protótipo, copie os dados e envie ao pesquisador.</p>
          <textarea id="dados-json" readonly style="min-height:180px;font-family:ui-monospace,Consolas,monospace;font-size:.8rem">${esc(JSON.stringify(dados, null, 2))}</textarea>
          <div class="linha"><button class="btn btn-pri" id="btn-copiar">Copiar dados</button><span class="muted peq" id="msg-copiar"></span>
            <button class="btn" id="btn-reiniciar" style="margin-left:auto">Recomeçar do zero</button></div>
          <p class="aviso" id="conf-reiniciar" hidden>Isso apaga as respostas e os tempos deste navegador. <button class="btn-link" id="btn-reiniciar-sim">Apagar e recomeçar</button></p>
        </section>`}
      </div>`;
  }

  function render() {
    E.mostrarPend = !!E.mostrarPend;
    if (E.etapa === 'inicio') telaInicio();
    else if (E.etapa === 'casos') telaCasos();
    else if (E.etapa === 'treino') telaTreino();
    else if (E.etapa === 'modulo') telaModulo();
    else if (E.etapa === 'caso') telaCaso();
    else if (E.etapa === 'questionario') telaQuestionario();
    else telaFim();
    salvar(E.etapa === 'fim');
  }
  function ir(etapa) { tick(); E.etapa = etapa; E.mostrarPend = false; render(); window.scrollTo(0, 0); }

  // ---------------------------------------------------------------- eventos
  app.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset.a) { E.avaliador[t.dataset.a] = t.type === 'checkbox' ? t.checked : t.value; salvar();
      const b = document.getElementById('btn-comecar'); if (b) { b.disabled = !podeComecar(); document.getElementById('msg-comecar').textContent = podeComecar() ? '' : 'Preencha nome ou código, titulação e aceite o termo para começar.'; } }
    if (t.dataset.q) { E.questionario[t.dataset.q] = t.value; salvar(); }
    if (t.dataset.k && t.tagName === 'TEXTAREA') { rc(E.casoAtual).r[t.dataset.k] = t.value; salvar(); }
  });
  app.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.dataset.quiz) {
      if (T().quiz[t.dataset.quiz] == null) T().quiz[t.dataset.quiz] = +t.value;
      tick(); const y = window.scrollY; render(); window.scrollTo(0, y); return;
    }
    if (t.dataset.k && t.type === 'radio') {
      rc(E.casoAtual).r[t.dataset.k] = t.value; salvar();
      const precisaRedesenhar = /p4\..+\.42$|p5\.5[34]$/.test(t.dataset.k);
      if (precisaRedesenhar) { tick(); const y = window.scrollY; render(); window.scrollTo(0, y); }
      else atualizarContagem();
    }
  });
  function atualizarContagem() {
    const c = caso(E.casoAtual); if (!c) return;
    document.querySelectorAll('.passo').forEach((b) => { const pp = pendentes(c, +b.dataset.parte); b.classList.toggle('ok', !pp); b.querySelector('.n').textContent = pp ? pp + ' pend.' : '✓'; });
    const pend = pendentes(c, E.parteAtual); const s = document.querySelector('.rodape-parte > span');
    if (s) { s.className = pend ? 'aviso' : 'muted peq'; s.firstChild.textContent = (pend ? `${pend} resposta(s) pendente(s) nesta parte` : 'Parte completa') + ' · tempo nesta parte: '; }
  }
  app.addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.id === 'btn-comecar') { if (podeComecar()) ir(MODULOS.length && T().situacao === 'novo' ? 'treino' : 'casos'); }
    else if (b.dataset.modulo != null) abrirModulo(+b.dataset.modulo);
    else if (b.id === 'btn-mod-ant') abrirModulo(T().mod - 1);
    else if (b.id === 'btn-mod-prox') abrirModulo(T().mod + 1);
    else if (b.id === 'btn-sumario' || b.id === 'btn-treino') ir('treino');
    else if (b.id === 'btn-ir-casos') ir('casos');
    else if (b.id === 'btn-pular') { if (T().situacao === 'pulado') ir('casos'); else document.getElementById('conf-pular').hidden = false; }
    else if (b.id === 'btn-pular-sim') { T().situacao = 'pulado'; T().pulou = true; ir('casos'); }
    else if (b.id === 'btn-treino-fim') { if (T().situacao === 'concluido') ir('casos'); else concluirTreino(); }
    else if (b.dataset.abrir) { E.casoAtual = b.dataset.abrir; E.parteAtual = 1; pausado = false; ir('caso'); }
    else if (b.id === 'btn-voltar') ir('casos');
    else if (b.dataset.parte) { tick(); E.parteAtual = +b.dataset.parte; E.mostrarPend = false; render(); window.scrollTo(0, 0); }
    else if (b.id === 'btn-ant') { tick(); E.parteAtual--; render(); window.scrollTo(0, 0); }
    else if (b.id === 'btn-prox') { tick(); E.parteAtual++; render(); window.scrollTo(0, 0); }
    else if (b.id === 'btn-pausa') { tick(); pausado = !pausado; b.textContent = pausado ? 'Retomar' : 'Pausar'; tick(); }
    else if (b.id === 'btn-concluir') {
      const c = caso(E.casoAtual); const total = totalPendentes(c);
      if (total) { E.mostrarPend = true; const p = PARTES.find((pp) => pendentes(c, pp.n)); tick(); E.parteAtual = p.n; render(); window.scrollTo(0, 0); return; }
      tick(); const x = rc(c.id); x.concluido = true; x.fim = new Date().toISOString();
      if (c.treino) { x.primeira = Object.assign({}, x.r); E.parteAtual = 1; E.mostrarPend = false; render(); window.scrollTo(0, 0); return; }
      ir('casos');
    }
    else if (b.id === 'btn-quest') ir('questionario');
    else if (b.id === 'btn-finalizar') ir('fim');
    else if (b.id === 'btn-copiar') {
      const ta = document.getElementById('dados-json'); const msg = document.getElementById('msg-copiar');
      const ok = () => { msg.textContent = 'Dados copiados.'; };
      const falha = () => { ta.focus(); ta.select(); msg.textContent = 'Selecionei o texto: use Ctrl+C para copiar.'; };
      try { navigator.clipboard.writeText(ta.value).then(ok, falha); } catch (e) { falha(); }
    }
    else if (b.id === 'btn-reiniciar') document.getElementById('conf-reiniciar').hidden = false;
    else if (b.id === 'btn-reiniciar-sim') { E = novoEstado(); try { localStorage.removeItem(CHAVE); } catch (e) { /* sem armazenamento */ } render(); }
  });

  if (E.etapa === 'caso' && !caso(E.casoAtual)) E.etapa = 'casos';
  if (E.etapa === 'modulo' && !MODULOS[E.treino.mod]) E.etapa = 'treino';
  render();
};
// Casos: casos.js (reais, fora do repositório público); se não existir, os de exemplo.
(function carregarCasos() {
  if (window.crivoNuvem && window.crivoNuvem.ativo) {
    document.getElementById('app').innerHTML = '<p class="muted">Carregando…</p>';
    window.crivoNuvem.iniciar().then((r) => { window.CRIVO_CASOS = r.casos; window.iniciarCrivo(r); }).catch((e) => {
      const msg = e && (e.codigo === 'sem_codigo' || e.codigo === 'convite_invalido')
        ? 'Acesse pelo link individual que você recebeu do pesquisador. Se o link não funcionar, peça um novo.'
        : 'Não foi possível conectar. Verifique a internet e recarregue a página.';
      document.getElementById('app').innerHTML = '<section class="painel pilha" style="max-width:640px"><h1>Acesso ao pré-teste</h1><p>' + msg + '</p></section>';
    });
    return;
  }
  const s = document.createElement('script');
  s.src = 'casos.js';
  s.onload = () => window.iniciarCrivo();
  s.onerror = () => { const e = document.createElement('script'); e.src = 'casos.exemplo.js'; e.onload = () => window.iniciarCrivo(); document.body.appendChild(e); };
  document.body.appendChild(s);
})();
</script>
</body>
